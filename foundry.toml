[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# Aevum runs the Shanghai EVM: no MCOPY, TSTORE/TLOAD or blob opcodes.
# Never raise this to "cancun", or contracts that pass tests will fail on chain.
solc_version = "0.8.28"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
# 200 runs: below ~200 the optimizer moves 32-byte constants into a data section after the code, which
# QDay's opcode checker (tools/check-shanghai.mjs) reads as instructions and flags as TLOAD/MCOPY.
# BiuWuiCircle stays under the 24,576-byte limit (EIP-170) at 200; circles are clones of one implementation.
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 64

[rpc_endpoints]
aevum = "https://rpc-test.qday.info"

[fmt]
line_length = 110

[lint]
lint_on_build = false
