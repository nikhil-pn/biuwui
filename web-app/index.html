<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Biu Wui · save together</title>
  <meta name="description" content="Biu Wui: a savings circle where members bid for the pot. Nobody needs gas, and nobody can run off with the pot. QDay Aevum testnet.">
  <meta name="theme-color" content="#f1ece8">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Biu Wui">
  <meta property="og:title" content="Biu Wui · save together">
  <meta property="og:description" content="Open a savings circle, pay in by signing, bid for the pot. No gas, and the pot only goes to a locked payee.">
  <meta property="og:image" content="https://biuwui.exprmnts.fun/og.png">
  <link rel="preload" href="/fonts/inter-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/glass.css">
  <link rel="stylesheet" href="/css/wallet.css">
  <link rel="stylesheet" href="/css/ring.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body data-screen="loading">
  <div class="ambient" aria-hidden="true"></div>
  <header class="topbar">
    <div class="topbar-in glass sheen">
      <div class="tb-left">
        <a class="icon-btn" href="https://biuwui.exprmnts.fun" aria-label="About Biu Wui">
          <span class="cjk" aria-hidden="true">標會</span>
        </a>
        <div class="mode-seg" id="mode-seg" role="radiogroup" aria-label="Mode">
          <button role="radio" data-mode="live" aria-checked="true"><span class="dot"></span>Live</button>
          <button role="radio" data-mode="demo" aria-checked="false">Demo</button>
        </div>
      </div>
      <button class="pill" id="circle-pill"><span id="pill-name">Biu Wui</span>
        <svg width="10" height="14" viewBox="0 0 10 14" aria-hidden="true"><path d="M2 5l3-3 3 3M2 9l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="avatar" id="profile-btn" aria-label="Profile, how it works and security">You</button>
    </div>
  </header>

  <main id="screen" class="screen"><div class="boot"><span class="spinner"></span></div></main>

  <nav class="dock" aria-label="App">
    <div class="dock-pill glass sheen">
      <button class="dock-btn active" data-tab="home" aria-label="Home">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3.5"/><path d="M7 6V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>Home</span>
      </button>
      <button class="dock-btn" data-tab="activity" aria-label="Activity">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 20V5M8 5 4 9M8 5l4 4M16 4v15m0 0 4-4m-4 4-4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Activity</span>
      </button>
      <button class="dock-btn" data-tab="members" aria-label="Members">
        <svg width="22" height="20" viewBox="0 0 26 22" aria-hidden="true"><circle cx="8" cy="8" r="6" opacity=".6"/><circle cx="17" cy="11" r="6" opacity=".4"/><circle cx="13" cy="17" r="4" opacity=".3"/></svg><span>Members</span>
      </button>
    </div>
    <button class="dock-plus glass sheen" id="dock-plus" aria-label="Start a circle">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </nav>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
